<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить объявление</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-block">
            <div class="logo">
                <div class="logo-icon">📋</div> 
                <span class="logo-text">Объявления</span>
            </div>
            <nav id="auth-nav"></nav>
        </div>
    </header>

    <main class="container form-page">
        <a href="index.html" class="back-link">← Назад к объявлениям</a>
        <h1 class="form-title">Добавить объявление</h1>
        
        <form class="add-form" action="#" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Заголовок</label>
                <input type="text" id="title" name="title" placeholder="Например: Механические часы Победа" required>
            </div>

            <div class="form-group">
                <label for="price">Цена (₽)</label>
                <input type="number" id="price" name="price" placeholder="12000" required>
            </div>

            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" name="description" rows="5" placeholder="Расскажите о товаре..." required></textarea>
            </div>

            <div class="form-group">
                <label for="image">Фото</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>

            <button type="submit" class="btn-submit">Опубликовать</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
