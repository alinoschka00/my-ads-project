<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить объявление</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-block">
            <a href="index.html" class="logo">
                <div class="logo-icon">📋</div>
                <span class="logo-text">Объявления</span>
            </a>
            <nav id="auth-nav"></nav>
        </div>
    </header>

    <main class="form-page">
        <a href="index.html" style="display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; font-size: 14px;">← Назад к объявлениям</a>

        <h1 class="form-title">Добавить объявление</h1>

        <form class="add-form" id="add-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Заголовок</label>
                <input type="text" id="title" name="title" placeholder="Например: Механические часы Победа" maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="price">Цена (₽)</label>
                <input type="number" id="price" name="price" placeholder="12000" min="0" step="1" required>
            </div>

            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" name="description" rows="5" maxlength="2000" placeholder="Расскажите о товаре..." required></textarea>
            </div>

            <div class="form-group">
                <label for="image">Фото</label>
                <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp" required>
            </div>

            <button type="submit" class="btn-submit">Опубликовать</button>
        </form>
    </main>

    <footer class="site-footer container">
        <a href="mailto:info@gmail.com" class="footer-email">info@gmail.com</a>
        <a href="developer.html" class="footer-developer">Информация о разработчике</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
