
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container header-block">
        <a href="index.html" class="logo">
            <span class="logo-icon">📋</span>
            <span class="logo-text">Объявления</span>
        </a>
    </div>
</header>

<main class="container form-page">
    <section class="form-card">

        <h1 class="form-title">Создать аккаунт</h1>
        <p class="form-subtitle">Заполните данные для регистрации</p>

        <form id="register-form" class="add-form">

            <div class="form-group">
                <label for="reg-name">Ваше имя</label>
                <input type="text" id="reg-name"
                       placeholder="Введите имя" required>
            </div>

            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email"
                       placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="reg-password">Пароль</label>
                <input type="password" id="reg-password"
                       minlength="8" placeholder="Минимум 8 символов" required>
            </div>

            <div class="form-group">
                <label for="reg-confirm">Повторите пароль</label>
                <input type="password" id="reg-confirm"
                       placeholder="Повторите пароль" required>
            </div>

            <p id="register-error" class="auth-error"></p>

            <button type="submit" class="btn-submit">
                Зарегистрироваться
            </button>

        </form>

        <p class="auth-switch">
            Уже есть аккаунт?
            <a href="login.html">Войти</a>
        </p>

    </section>
</main>

<script src="script.js"></script>
</body>
</html>
