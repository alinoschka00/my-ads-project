
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — Объявления</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ШАПКА -->
    <header class="site-header">

        <div class="container header-block">

            <a href="index.html" class="logo">
                <span class="logo-icon">📋</span>
                <span class="logo-text">Объявления</span>
            </a>

        </div>

    </header>


    <!-- РЕГИСТРАЦИЯ -->
    <main class="container form-page">

        <section class="form-card">

            <h1 class="form-title">
                Создать аккаунт
            </h1>

            <p class="form-subtitle">
                Заполните данные для регистрации
            </p>


            <form id="register-form" class="add-form">

                <!-- ИМЯ -->
                <div class="form-group">

                    <label for="reg-name">
                        Ваше имя
                    </label>

                    <input
                        type="text"
                        id="reg-name"
                        name="name"
                        placeholder="Введите имя"
                        autocomplete="name"
                        maxlength="60"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="reg-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="reg-email"
                        name="email"
                        placeholder="example@mail.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- ПАРОЛЬ -->
                <div class="form-group">

                    <label for="reg-password">
                        Пароль
                    </label>

                    <input
                        type="password"
                        id="reg-password"
                        name="password"
                        minlength="8"
                        autocomplete="new-password"
                        placeholder="Минимум 8 символов"
                        required
                    >

                </div>


                <!-- ПОВТОР ПАРОЛЯ -->
                <div class="form-group">

                    <label for="reg-confirm">
                        Повторите пароль
                    </label>

                    <input
                        type="password"
                        id="reg-confirm"
                        name="confirm"
                        minlength="8"
                        autocomplete="new-password"
                        placeholder="Повторите пароль"
                        required
                    >

                </div>


                <!-- ОШИБКА -->
                <p
                    id="register-error"
                    class="auth-error"
                    role="alert"
                    aria-live="polite"
                ></p>


                <!-- КНОПКА -->
                <button
                    type="submit"
                    class="btn-submit"
                >
                    Зарегистрироваться
                </button>

            </form>


            <!-- ПЕРЕХОД КО ВХОДУ -->
            <p class="auth-switch">

                Уже есть аккаунт?

                <a href="login.html">
                    Войти
                </a>

            </p>


            <a href="index.html" class="back-link">
                ← Вернуться к объявлениям
            </a>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
