<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Объявления</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-block">
            <a href="index.html" class="logo">
                <div class="logo-icon">📋</div>
                <span class="logo-text">Объявления</span>
            </a>
            <nav id="auth-nav">
                <a href="login.html">Вход</a>
            </nav>
        </div>
    </header>

    <main class="form-page">
        <div class="form-header">
            <span class="active">Регистрация</span>
            <a href="login.html" class="inactive">Авторизация</a>
        </div>
        
        <form action="#">
            <div class="form-group">
                <input type="text" placeholder="Ваше имя" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Пароль" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Повторите пароль" required>
            </div>
            
            <label class="checkbox-label">
                <input type="checkbox" required>
                <span>Согласен на обработку персональных данных</span>
            </label>

            <button type="submit" class="btn-submit">Зарегистрироваться</button>
            
            <p class="required-text">Все поля обязательны для заполнения</p>
        </form>
    </main>

    <footer class="site-footer container">
        <a href="mailto:info@gmail.com" class="footer-email">info@gmail.com</a>
        <a href="developer.html" class="footer-developer">Информация о разработчике</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
