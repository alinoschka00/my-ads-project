
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container header-block">
        <a href="index.html" class="logo">
            <span class="logo-icon">📋</span>
            <span class="logo-text">Объявления</span>
        </a>
    </div>
</header>

<main class="container form-page">
    <section class="form-card">

        <h1 class="form-title">Вход в аккаунт</h1>
        <p class="form-subtitle">Рады видеть вас снова!</p>

        <form id="login-form" class="add-form">

            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email"
                       placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password"
                       placeholder="Введите пароль" required>
            </div>

            <p id="login-error" class="auth-error"></p>

            <button type="submit" class="btn-submit">
                Войти
            </button>

        </form>

        <p class="auth-switch">
            Нет аккаунта?
            <a href="register.html">Зарегистрироваться</a>
        </p>

    </section>
</main>

<script src="script.js"></script>
</body>
</html>
