
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Объявления</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ШАПКА -->
    <header class="site-header">

        <div class="container header-block">

            <a href="index.html" class="logo">
                <div class="logo-icon">📋</div>
                <span class="logo-text">Объявления</span>
            </a>

            <nav id="auth-nav">
                <a href="#" onclick="login(); return false;">Регистрация</a>
                <a href="#" onclick="login(); return false;">Вход</a>
            </nav>

        </div>

    </header>


    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="container">

        <section class="page-header">

            <h1>Новые объявления</h1>

            <!-- КНОПКА ДОБАВЛЕНИЯ -->
            <a href="add.html" class="btn-add">

                <img
                    src="img/+.png"
                    alt=""
                    class="add-icon"
                >

                <span>Добавить объявление</span>

            </a>

        </section>


        <!-- КАРТОЧКИ ОБЪЯВЛЕНИЙ -->
        <section
            class="cards-grid"
            id="cards-container"
            aria-label="Список объявлений"
            aria-live="polite"
        >

        </section>


        <!-- ПОКАЗАТЬ ЕЩЁ -->
        <div class="load-more-container">

            <button
                type="button"
                class="btn-load-more"
                id="load-more-btn"
                onclick="loadMoreCards()"
            >
                Показать еще
            </button>

        </div>

    </main>


    <!-- ПОДВАЛ -->
    <footer class="site-footer container">

        <a href="mailto:info@gmail.com" class="footer-email">
            info@gmail.com
        </a>

        <a href="developer.html" class="footer-developer">
            Информация о разработчике
        </a>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
